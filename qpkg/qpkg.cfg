# ComfyUI QPKG. This is a thin wrapper around a Container Station compose
# stack: the image is built in place on first start, data lives in
# <Container>/comfyui, and removing the package leaves output, user and
# models-local untouched.

QPKG_NAME="ComfyUI"
QPKG_DISPLAY_NAME="ComfyUI"
QPKG_VER="0.36.0"
QPKG_AUTHOR="ivanusto"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="ComfyUI diffusion server on a QNAP NAS with an NVIDIA GPU"

# Must be greater than the RC_Number of container-station and the NVIDIA GPU
# Driver package (both are usually 101) so that this starts after them. Check
# yours with:
#   getcfg container-station RC_Number -f /etc/config/qpkg.conf
QPKG_RC_NUM="199"
QPKG_SERVICE_PROGRAM="ComfyUI.sh"

QPKG_REQUIRE="container-station >= 3.0, NVIDIA_GPU_DRV"
QPKG_REQUIRE_MSG="Requires Container Station 3.0 or later and the NVIDIA GPU Driver QPKG."

QPKG_WEBUI="/"
QPKG_WEB_PORT="8188"
QPKG_SERVICE_PORT="8188"

QTS_MINI_VERSION="5.0.0"

# 3 = supports both installation and migration, so the user picks the volume.
QPKG_VOLUME_SELECT="3"

# The first start builds a roughly 9 GB image, so the default 15 second
# timeout is nowhere near enough. The NVIDIA kernel modules can also take
# several minutes to load after a reboot.
QPKG_TIMEOUT="1800,300"

QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_SHARED="shared"
