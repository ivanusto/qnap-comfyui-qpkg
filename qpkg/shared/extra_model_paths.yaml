# Extra model search paths for ComfyUI. The mount points inside the container
# are fixed:
#   /models/public  read only, the shared model folder (COMFY_MODELS_SHARED)
#   /models/local   writable, models-local under the stack directory
#
# Four behaviours of folder_paths.py that are not in the documentation and that
# will silently change which weights you load:
#
# 1. The diffusion_models key already searches both models/diffusion_models and
#    models/unet by default.
#
# 2. text_encoders is bound to both models/text_encoders and models/clip, and
#    map_legacy maps the "clip" key onto "text_encoders". So the two keys below
#    merge into one namespace rather than staying separate.
#
# 3. get_full_path returns the first hit with no warning, and get_filename_list_
#    deduplicates by filename, so the dropdown shows one entry. The usual real
#    collision is clip_l.safetensors existing under both clip/ and
#    text_encoders/ at different sizes, with nothing in the UI to tell them
#    apart.
#
# 4. is_default: true makes the loader call insert(0, ...) for every path, so a
#    multi-line block is searched in REVERSE order and the last line wins. The
#    two multi-line blocks below are therefore written back to front on purpose.
#    If you edit them, verify the result rather than assuming. The method is in
#    docs/HARDWARE-NOTES.md.

shared_models:
    base_path: /models/public/
    is_default: true
    # Written in reverse. Effective order is diffusion_models/ then unet/.
    diffusion_models: |
        unet/
        diffusion_models/
    # Written in reverse. Effective order is text_encoders/ then clip/.
    text_encoders: |
        clip/
        text_encoders/
    vae: vae/
    loras: loras/
    controlnet: controlnet/
    clip_vision: clip_vision/
    embeddings: embeddings/
    upscale_models: upscale_models/
    style_models: style_models/
    model_patches: model_patches/
    configs: configs/

# Writable area under the stack directory. A good place for GGUF quantizations
# and anything else you download yourself.
local_models:
    base_path: /models/local/
    diffusion_models: diffusion_models/
    text_encoders: text_encoders/
    vae: vae/
    loras: loras/
    unet_gguf: unet/
    clip_gguf: clip/
