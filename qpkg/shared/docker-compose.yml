# ComfyUI on QNAP Container Station, with an NVIDIA GPU passed through.
#
# Every path comes from the .env file next to this one, generated at install
# time. Do not hard code /share/CACHEDEV1_DATA or /share/ZFS<n>_DATA here: the
# pool name differs per machine, /share/Container and /share/Public are
# symlinks, and /share itself is a tmpfs. Install time resolves them all with
# readlink -f.
name: comfyui

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMFY_REF: ${COMFY_REF:-v0.35.1}
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
        TORCH_VERSION: ${TORCH_VERSION:-2.9.1+cu128}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.24.1+cu128}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION:-2.9.1+cu128}
    image: comfyui-nas:${COMFY_REF:-v0.35.1}
    container_name: comfyui
    restart: unless-stopped

    # Container Station registers the runtime as nvidia-runtime, not the usual
    # nvidia. Do not switch to deploy.resources.reservations.devices either:
    # Compose turns that into a device request carrying Driver: "nvidia", which
    # matches nothing here, and Compose v2 support for deploy outside swarm is
    # limited anyway. Check yours with: docker info | grep Runtimes
    runtime: ${COMFY_GPU_RUNTIME:-nvidia-runtime}

    environment:
      # Neither of these is optional. nvidia-container-runtime leaves
      # accept-nvidia-visible-devices-envvar-when-unprivileged at its default of
      # true, so the hook reads this variable to decide what to expose. Unset
      # behaves as "void" and the container sees no GPU at all.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # With only "utility" you get a working nvidia-smi but no libcuda.so.1,
      # and torch quietly reports CUDA as unavailable.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TZ=${TZ:-UTC}
      - COMFY_DIR=/opt/ComfyUI

    ports:
      - "${COMFY_PORT:-8188}:8188"

    # Ownership of generated files. Filled in at install time.
    user: "${PUID:-0}:${PGID:-100}"

    # cgroup counts mmap page cache against this limit, but that memory is
    # reclaimable, so exceeding it triggers reclaim rather than an OOM kill.
    # From ComfyUI v0.35 on it is also read back as the total RAM, which sizes
    # the pinned memory pool (roughly the limit minus 4 GB, and swap is ignored
    # once a limit is set). Setting it too low is actively harmful: big models
    # get less pinned memory and their page cache is evicted back to disk.
    # Setting it too high is harmful as well on QuTS hero, where the ZFS ARC
    # holds tens of GB outside MemAvailable and releases it slowly, so the host
    # swaps. install sets physical RAM minus the ARC floor minus 8 GB. See
    # docs/HARDWARE-NOTES.md.
    mem_limit: ${COMFY_MEM_LIMIT:-26g}
    memswap_limit: ${COMFY_MEMSWAP_LIMIT:-50g}
    shm_size: ${COMFY_SHM_SIZE:-2gb}

    # If this NAS runs watchtower, it updates every container by default.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

    volumes:
      - ${COMFY_STACK}/ComfyUI:/opt/ComfyUI
      - ${COMFY_STACK}/custom_nodes:/opt/ComfyUI/custom_nodes
      - ${COMFY_STACK}/user:/opt/ComfyUI/user
      - ${COMFY_STACK}/extra_model_paths.yaml:/opt/ComfyUI/extra_model_paths.yaml:ro
      - ${COMFY_STACK}/pip-extra:/opt/pip-extra
      - ${COMFY_STACK}/output:/output
      - ${COMFY_STACK}/input:/input
      - ${COMFY_STACK}/temp:/temp
      - ${COMFY_STACK}/models-local:/models/local
      # Shared model library, read only. To mount a second model root, add a
      # line here and a matching base_path in extra_model_paths.yaml.
      - ${COMFY_MODELS_SHARED}:/models/public:ro

    command:
      - --listen
      - "0.0.0.0"
      - --port
      - "8188"
      - --output-directory
      - /output
      - --input-directory
      - /input
      - --temp-directory
      - /temp
      # Hold back this many GB for the driver. Raise it if you hit OOM.
      - --reserve-vram
      - "${COMFY_RESERVE_VRAM:-0.5}"
      # Deliberately absent, see docs/HARDWARE-NOTES.md:
      #   --lowvram    a no-op while DynamicVRAM is enabled
      #   --highvram / --gpu-only / --novram / --cpu   each disables DynamicVRAM
      #   --fast-disk  streams weights from disk every step
      #   --supports-fp8-compute   claims a capability the card may not have

# If another container on this NAS needs to call ComfyUI, note that bridge
# containers here cannot open TCP connections to the NAS's own LAN address. It
# times out rather than being refused, and ping still works, so it looks like
# ComfyUI is down. Put both containers on one network and use the container
# name, http://comfyui:8188. For example:
#
#   networks:
#     - default
#     - othernet
#
# with a top level:
#
#   networks:
#     default:
#     othernet:
#       external: true
#       name: <other_stack>_default
